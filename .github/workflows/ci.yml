name: API and OpenAPI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: test
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: fixture-ci-only
      DATABASE_URL: postgresql://postgres:fixture-ci-only@127.0.0.1:54333/postgres
      DIRECT_URL: postgresql://postgres:fixture-ci-only@127.0.0.1:54333/postgres
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Unit tests without a database
        run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config jest.config.cjs --runInBand --testPathIgnorePatterns='\.local\.test\.cjs$'
      - run: node dist/openapi.js
      - name: Require a versioned, current contract
        run: test -s openapi.json && git ls-files --error-unmatch openapi.json && git diff --exit-code -- openapi.json
      - uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error
          retention-days: 7
